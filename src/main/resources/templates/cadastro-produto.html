    <!DOCTYPE html>
    <html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Cadastrar Produto</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        </head>
        <body class="bg-light">
            <nav class="navbar navbar-dark bg-primary mb-4">
                <div class="container">
                    <a class="navbar-brand" href="/produtos">FATEC - Catálogo</a>
                </div>
            </nav>

            <div class="container">
                <div class="card shadow mx-auto" style="max-width: 500px;">
                    <div class="card-header bg-white">
                        <h2 class="mb-0">Novo Produto</h2>
                    </div>
                    <div class="card-body">
                        <form id="formProduto" th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                            <input type="hidden" th:field="*{idProduto}">

                            <div class="mb-3">
                                <label class="form-label">Nome do Produto</label>
                                <input type="text" th:field="*{nome}"
                                       th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : ''"
                                       class="form-control">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Valor (R$)</label>
                                <input type="number" step="0.01" th:field="*{valor}"
                                       th:classappend="${#fields.hasErrors('valor')} ? 'is-invalid' : ''"
                                       class="form-control">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Quantidade</label>
                                <input type="number" th:field="*{quantidade}"
                                       th:classappend="${#fields.hasErrors('quantidade') or erroQuantidade != null} ? 'is-invalid' : ''"
                                       class="form-control">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}"></div>
                                <div class="invalid-feedback" th:if="${erroQuantidade}" th:text="${erroQuantidade}"></div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Categoria</label>
                                <select th:field="*{categoria}" class="form-select" required>
                                    <option value="" disabled selected>Selecione uma categoria...</option>
                                    <option th:each="cat : ${categorias}"
                                            th:value="${cat.idCategoria}"
                                            th:text="${cat.nome}">
                                    </option>
                                </select>
                                <div class="text-danger" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                            </div>

                            <div class="mt-4">
                                <button type="button" class="btn btn-primary" id="btnSalvar">
                                    Salvar Produto
                                </button>
                                <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="modalConfirmacaoSalvar" tabindex="-1"
                 aria-labelledby="modalSalvarLabel" aria-hidden="true">
                <div class="modal-dialog">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h5 class="modal-title" id="modalSalvarLabel">
                                <i class="bi bi-floppy-fill text-primary me-2"></i>
                                Confirmar Salvamento
                            </h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>

                        <div class="modal-body">
                            <p>Tem certeza que deseja salvar as informações deste produto?</p>
                            <p class="text-muted mb-0"><small>Os dados serão registrados no catálogo.</small></p>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary"
                                    data-bs-dismiss="modal">Cancelar</button>
                            <button type="button" class="btn btn-primary" id="btnConfirmar">
                                <i class="bi bi-check-lg me-1"></i> Confirmar
                            </button>
                        </div>

                    </div>
                </div>
            </div>

            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

            <script>
                const modal = new bootstrap.Modal(document.getElementById('modalConfirmacaoSalvar'));

                document.getElementById('btnSalvar').addEventListener('click', function () {
                    const form = document.getElementById('formProduto');
                    if (!form.checkValidity()) {
                        form.reportValidity();
                        return;
                    }
                    modal.show();
                });

                document.getElementById('btnConfirmar').addEventListener('click', function () {
                    document.getElementById('formProduto').submit();
                });
            </script>
        </body>
    </html>
