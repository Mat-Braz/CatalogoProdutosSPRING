<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/produtos">FATEC - Catálogo</a>
    </div>
</nav>
<div class="container mt-5">
    <div class="card shadow mx-auto" style="max-width: 600px;">
        <div class="card-header bg-white">
            <h3 class="mb-0">Editar Produto</h3>
        </div>
        <div class="card-body">
            <form id="formEditar" th:action="@{/produtos/editar/{id}(id=${produto.idProduto})}" th:object="${produto}"
                  method="post">

                <input type="hidden" th:field="*{idProduto}">

                <div class="mb-3">
                    <label class="form-label">Nome do Produto</label>
                    <input type="text" th:field="*{nome}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Preço (R$)</label>
                    <input type="number" step="0.01" th:field="*{valor}" class="form-control" required>
                    <div class="text-danger" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantidade</label>
                    <input type="number" th:field="*{quantidade}" class="form-control" required min="0">
                    <div class="text-danger" th:if="${#fields.hasErrors('quantidade')}" th:errors="*{quantidade}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Categoria</label>
                    <select th:field="*{categoria}" class="form-select" required>
                        <option th:each="cat : ${categorias}"
                                th:value="${cat.idCategoria}"
                                th:text="${cat.nome}">
                        </option>
                    </select>
                </div>

                <div id="alertaSemAlteracao" class="alert alert-danger d-none mt-3" role="alert">
                    <i class="bi bi-exclamation-circle-fill me-2"></i>
                    Nenhum campo foi alterado. Faça ao menos uma alteração para salvar.
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
                    <button type="button" class="btn btn-primary" id="btnSalvarEdicao">
                        Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalConfirmacaoEditar" tabindex="-1"
     aria-labelledby="modalEditarLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalEditarLabel">
                    <i class="bi bi-floppy-fill text-primary me-2"></i>
                    Confirmar Alteração
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <div class="modal-body">
                <p>Tem certeza que deseja alterar as informações deste produto?</p>
                <p class="text-muted mb-0"><small>Os dados serão alterados no catálogo.</small></p>
            </div>

            <div class="modal-footer">
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary"
                            data-bs-dismiss="modal">Cancelar
                    </button>
                    <button type="button" class="btn btn-primary" id="btnConfirmarEdicao">
                        <i class="bi bi-check-lg me-1"></i> Confirmar
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const modal = new bootstrap.Modal(document.getElementById('modalConfirmacaoEditar'));
    const alertaSemAlteracao = document.getElementById('alertaSemAlteracao');
    const valoresOriginais = {
        nome: document.getElementById('nome').value,
        valor: document.getElementById('valor').value,
        quantidade: document.getElementById('quantidade').value,
        categoria: document.getElementById('categoria').value
    };

    document.getElementById('btnSalvarEdicao').addEventListener('click', function () {
        const form = document.getElementById('formEditar');

        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }

        const semAlteracao =
            document.getElementById('nome').value      === valoresOriginais.nome &&
            document.getElementById('valor').value     === valoresOriginais.valor &&
             document.getElementById('quantidade').value  === valoresOriginais.quantidade &&
            document.getElementById('categoria').value === valoresOriginais.categoria;

        if (semAlteracao) {
            alertaSemAlteracao.classList.remove('d-none'); // exibe o alerta
            return;
        }

        alertaSemAlteracao.classList.add('d-none'); // esconde se estava visível
        modal.show();
    });

    document.getElementById('btnConfirmarEdicao').addEventListener('click', function () {
        document.getElementById('formEditar').submit();
    });
</script>

</body>
</html>
